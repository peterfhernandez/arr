# ARR stack for Docker Desktop on Windows 11 Home
# Repo + config location: G:\coderepo\arr        (this file, Caddyfile, and
#                                                  per-app config under .\config\)
# Data location:          D:\arr                  (downloads, media — needs the free space)
#
# Bring up: docker compose up -d
# Logs:     docker compose logs -f <service>
# Stop:     docker compose down

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Must be empty (VPN_SERVER_COUNTRIES= in .env) when
      # VPN_SERVICE_PROVIDER=custom — gluetun errors at startup otherwise
      # ("the country specified is not valid"), since custom mode has no
      # server list to filter.
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      # Only used when VPN_SERVICE_PROVIDER=custom (see HOWTO.md step 2a) —
      # points gluetun at your provider-supplied .ovpn file directly,
      # instead of gluetun's own built-in server list, which can point at
      # a different server infrastructure than your cert/credentials are
      # actually valid for.
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.conf
      - TZ=${TZ}
    ports:
      # qBittorrent WebUI, published through gluetun's network namespace.
      # Host side moved off 8080 (already used by the wordpress-fleet
      # project's k3d-wp-fleet-dev-serverlb container) to 9090 — this only
      # affects direct http://<host>:9090 access; the
      # qbittorrent.arrhost.local route via Caddy is unaffected, since
      # Caddy reaches gluetun:8080 over the internal Docker network.
      - "9090:8080"
      # qBittorrent torrent port (adjust if you change it in qBittorrent)
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - D:/arr/downloads:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - D:/arr/downloads:/downloads
      - D:/arr/media/tv:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - D:/arr/downloads:/downloads
      - D:/arr/media/movies:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - D:/arr/media/movies:/movies
      - D:/arr/media/tv:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - D:/arr/media/movies:/data/movies
      - D:/arr/media/tv:/data/tvshows
    ports:
      - "8096:8096"
      # - "8920:8920"   # uncomment for HTTPS
      # - "7359:7359/udp" # uncomment for auto-discovery
      # - "1900:1900/udp" # uncomment for DLNA
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    # Reverse proxy: routes *.arrhost.local (see Caddyfile) to the right
    # container. Requires hosts-file entries for each subdomain — see HOWTO.md.
    depends_on:
      - gluetun
      - prowlarr
      - sonarr
      - radarr
      - bazarr
      - jellyfin
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    restart: unless-stopped
